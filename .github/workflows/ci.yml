name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            toolchain: stable
            require-llvm: true
          - os: windows-latest
            toolchain: stable
            require-llvm: false
          - os: ubuntu-24.04
            toolchain: 1.93.0
            require-llvm: false
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.os }}-${{ matrix.toolchain }}
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Install LLVM 18
        if: matrix.require-llvm
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y llvm-18
          llvm-pdbutil-18 --version
      - name: Run offline tests
        run: cargo +${{ matrix.toolchain }} test --locked --all-targets --all-features
      - name: Run required LLVM interoperability tests
        if: matrix.require-llvm
        env:
          LLVM_PDBUTIL: /usr/bin/llvm-pdbutil-18
        run: cargo +${{ matrix.toolchain }} test --locked --test roundtrip -- --ignored
      - name: Run doctests
        run: cargo +${{ matrix.toolchain }} test --locked --doc --all-features

  fuzz-check:
    name: Check fuzz targets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          key: fuzz-check-${{ runner.os }}-stable
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check standalone fuzz harnesses
        run: cargo +stable check --locked --manifest-path fuzz/Cargo.toml

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-${{ runner.os }}-stable
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Run clippy
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings

  docs:
    name: Rustdoc
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs-${{ runner.os }}-stable
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Build documentation
        run: cargo +stable doc --locked --no-deps --all-features

  fmt:
    name: Rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install nightly-2026-10-15 --profile minimal --component rustfmt --no-self-update
      - name: Run rustfmt
        run: |
          cargo +nightly-2026-10-15 fmt --all -- --check
          cargo +nightly-2026-10-15 fmt --manifest-path fuzz/Cargo.toml --all -- --check
